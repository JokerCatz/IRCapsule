<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IR Capsule</title>
<style>
  :root {
    --bg:#f6f7f4; --fg:#1a231f; --muted:#5c6a63; --line:#cbd3cd; --panel:#ecefe9; --card:#fbfcfa;
    --accent:#17744a; --accent-fg:#ffffff; --warn:#8a5a00; --warnbg:#f6ecd2; --bad:#b8321f; --info:#1c62a8;
    --wave:#17744a; --wave-bg:#e3e9e3;
    --sans:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0f1512; --fg:#e3ebe6; --muted:#98a7a0; --line:#2c3833; --panel:#17201c; --card:#131b17;
    --accent:#74d3a2; --accent-fg:#06180f; --warn:#f2c66d; --warnbg:#2a2414; --bad:#ff8f7a; --info:#86bdf0;
    --wave:#74d3a2; --wave-bg:#1c2823; color-scheme:dark; } }
  :root[data-theme="dark"]{
    --bg:#0f1512; --fg:#e3ebe6; --muted:#98a7a0; --line:#2c3833; --panel:#17201c; --card:#131b17;
    --accent:#74d3a2; --accent-fg:#06180f; --warn:#f2c66d; --warnbg:#2a2414; --bad:#ff8f7a; --info:#86bdf0;
    --wave:#74d3a2; --wave-bg:#1c2823; color-scheme:dark; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans)}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
  .bar{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  h1{font-size:1.15rem;margin:0;letter-spacing:-.01em}
  .grow{flex:1}
  main{max-width:1100px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
  nav{max-width:1100px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
  nav button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 14px;color:var(--muted);cursor:pointer;font:inherit;white-space:nowrap}
  nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
  button,select,input,textarea{font:inherit;color:var(--fg)}
  button.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer}
  button.btn:hover{border-color:var(--accent)}
  button.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
  button.btn.danger{color:var(--bad)}
  button.btn:disabled{opacity:.45;cursor:default}
  input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
  .card h2{font-size:1rem;margin:0}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .muted{color:var(--muted)} .mono{font-family:var(--mono);font-size:.92em}
  .chip{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--line);font-size:.8rem;color:var(--muted);white-space:nowrap}
  .chip.ok{color:var(--accent);border-color:var(--accent)} .chip.warn{color:var(--warn);border-color:var(--warn)} .chip.bad{color:var(--bad);border-color:var(--bad)}
  .note{background:var(--warnbg);border-left:3px solid var(--warn);padding:8px 12px;border-radius:0 4px 4px 0}
  .tablewrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--muted);font-weight:600;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase}
  canvas.wave{display:block;background:var(--wave-bg);border-radius:4px}
  .live{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto}
  .live .item{display:flex;gap:10px;align-items:center;padding:4px 6px;border-radius:6px;background:var(--panel)}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
  .dot.on{background:var(--bad);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.25}}
  @media (prefers-reduced-motion: reduce){.dot.on{animation:none}}
  .log{font-family:var(--mono);font-size:.85rem;display:flex;flex-direction:column;gap:2px;max-height:60vh;overflow-y:auto}
  .log div{display:flex;gap:10px} .log .t{color:var(--muted);min-width:64px}
  .bar-meter{height:8px;border-radius:4px;background:var(--panel);overflow:hidden;min-width:120px}
  .bar-meter i{display:block;height:100%;background:var(--accent)}
  dialog{border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);max-width:min(1000px,94vw);width:100%;padding:16px}
  dialog::backdrop{background:rgba(0,0,0,.5)}
  .wavebox{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
  .hero{text-align:left;max-width:640px}
  .live .item{flex-wrap:wrap}
  @media (max-width:700px){   /* phones: tables become stacked cards so the name field is never off-screen */
    table.stack thead{display:none}
    table.stack tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
    table.stack td{border:0;padding:0}
    table.stack.drafts td:nth-child(n+6), table.stack.sigs td:first-child, table.stack.sigs td:last-child, table.stack.rules td:nth-child(4), table.stack.rules td:last-child{grid-column:1/-1}
    table.stack input, table.stack select{width:100%}
  }
  [hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>IR Capsule</h1>
    <span id="status" class="chip">disconnected</span>
    <span class="grow"></span>
    <span id="recbadge" class="chip bad" hidden><span class="dot on"></span> <span data-i="Recording">Recording</span></span>
    <button class="btn" id="lang" title="Language">中文</button>
    <button class="btn" id="disc" hidden></button>
  </div>
  <nav id="tabs" role="tablist" hidden></nav>
</header>
<main id="app"></main>
<dialog id="dlg"></dialog>

<script>
"use strict";
/* =========================================================================================
   IR Capsule web config. One static file, no build. Talks the device's line-JSON protocol
   (docs/protocol.md) over Web Bluetooth, Web Serial, a dev WebSocket bridge, or a built-in demo.
   ========================================================================================= */
const SVC = "9f1d0001-6b7a-4c5e-8a2b-1c4a9e5d7f10", RXU = "9f1d0002-6b7a-4c5e-8a2b-1c4a9e5d7f10", TXU = "9f1d0003-6b7a-4c5e-8a2b-1c4a9e5d7f10";
const ST = { DRAFT: 0, ACTIVE: 1, OFF: 2 };
const enc = new TextEncoder(), dec = new TextDecoder();
const $ = (s, e = document) => e.querySelector(s);

/* ---------- i18n: English strings are the keys ---------- */
const ZH = {
  "Connect your IR Capsule":"連接你的 IR 膠囊","Bluetooth":"藍牙","USB serial":"USB 序列埠","Demo (no device)":"示範（不需裝置）",
  "disconnected":"未連線","connecting…":"連線中…","connected":"已連線","Disconnect":"中斷連線","Recording":"錄製中",
  "Record":"錄製","Signals":"訊號","Rules":"對照","Log":"紀錄","Device":"裝置",
  "Start recording":"開始錄製","Stop recording":"停止錄製","Point any remote at the receiver and press keys. Each new key becomes a numbered draft; pressing the same key again only raises its counter. Name the drafts below to make them usable.":"對著接收頭按任何遙控器的鍵。每個新的鍵會成為一筆依序編號的草稿，重複按同一個鍵只會增加次數。在下方為草稿命名後才能使用。",
  "LED test":"LED 測試","Start LED test":"開始 LED 測試","Stop":"停止","All LEDs blink for 60 s. Look through a phone camera (try the front one). Don't stare at them up close.":"所有 LED 閃爍 60 秒。請用手機相機觀看（先試前鏡頭），不要近距離直視。",
  "Live frames":"即時收到的訊號","Nothing heard yet.":"還沒有收到訊號。","Drafts":"草稿","No drafts. Start recording and press some keys.":"沒有草稿。開始錄製並按幾個鍵吧。",
  "Fill names from a list":"用清單批次命名","One name per line, applied in recording order to the drafts that have no name yet.":"每行一個名稱，依錄製順序套用到還沒命名的草稿。",
  "Apply names":"套用名稱","Save named drafts":"儲存已命名的草稿","Delete":"刪除","Name":"名稱","Type":"類型","Device":"裝置","Wave":"波形","Heard":"次數","Name this signal":"為這個訊號命名",
  "Appliance command":"家電指令","Remote key":"遙控器按鍵","(no device)":"（無）","Preview":"預覽","New draft":"新草稿","Draft":"草稿","Known":"已儲存","Triggered":"已觸發","Ignored":"忽略",
  "Saved signals":"已儲存的訊號","Send":"發射","Enable":"啟用","Disable":"停用","Active":"啟用","Disabled":"停用","Rename":"重新命名","Group":"分組","Add device":"新增裝置","Device name":"裝置名稱",
  "No saved signals yet. Record some and name them.":"還沒有已儲存的訊號。先錄製並命名。","Entries":"筆數","Carrier (kHz)":"載波 (kHz)","Save":"儲存","Cancel":"取消",
  "Rule":"規則","New rule":"新增規則","Trigger":"觸發","When I hear":"當聽到","Then do":"就執行","Add step":"新增步驟","Send signal":"發射訊號","Wait":"等待","Set layer":"切換圖層","Layer":"圖層","Run now":"立即執行",
  "Rules react to a saved signal heard by the receiver (for example a key on a spare remote) and run a list of steps. Disabled rules and drafts never fire. Rules do not fire while recording.":"規則會在接收頭聽到某個已儲存的訊號（例如備用遙控器的一個鍵）時，依序執行一串步驟。停用的規則與草稿不會被觸發，錄製中也不會觸發。",
  "No rules yet.":"還沒有規則。","(none)":"（無）","ms":"毫秒","Edit":"編輯","Close":"關閉","Device log":"裝置紀錄","Clear":"清除","Firmware":"韌體","Free heap":"可用記憶體","Storage":"儲存空間","Uptime":"運作時間","Bluetooth MTU":"藍牙 MTU",
  "Settings":"設定","Bluetooth name (applies after reboot)":"藍牙名稱（重開機後生效）","Ignore repeats within (ms)":"忽略重複觸發的間隔（毫秒）","Active layer":"目前圖層",
  "Backup":"備份","Export backup":"匯出備份","Import backup":"匯入備份","Exporting":"匯出中","Importing":"匯入中","Reboot":"重開機","Factory reset":"恢復原廠設定","This erases all signals, rules and devices on the capsule. Continue?":"這會清除膠囊上所有的訊號、規則與裝置。要繼續嗎？",
  "Danger zone":"危險操作","Signal sent":"已發射","Saved":"已儲存","Failed":"失敗","Heard x":"收到次數","entries":"筆","Total":"總長","Waveform":"波形","Linear time":"線性時間軸","Squeezed (long gaps shortened)":"壓縮（縮短長間隔）","Zoom":"縮放","Copy timings":"複製時間資料",
  "Unsupported in this browser.":"此瀏覽器不支援。","Web Bluetooth needs Chrome or Edge (Android/desktop). On iPhone use a browser such as Bluefy.":"Web Bluetooth 需要 Chrome 或 Edge（Android/桌面）。iPhone 請使用 Bluefy 等瀏覽器。",
  "Web Serial needs desktop Chrome or Edge.":"Web Serial 需要桌面版 Chrome 或 Edge。","Demo mode: a simulated capsule runs in this page.":"示範模式：此頁面內執行的是模擬的膠囊。",
  "Simulate a remote key":"模擬按下遙控器的鍵","Key A":"按鍵 A","Key B":"按鍵 B","AC state":"冷氣狀態",
  "drafts":"草稿","signals":"訊號","rules":"規則","Name needed before use":"需要先命名才能使用","Saved {n}":"已儲存 {n} 筆","Nothing to save: give the drafts names first.":"沒有可儲存的項目，請先替草稿命名。",
  "Heard a saved signal":"聽到已儲存的訊號","Learning counter":"次數","press":"次","Use as":"用途","Backup file":"備份檔","Restored":"已還原","sent":"已發射",
  "Not found":"找不到","Copied":"已複製","Rename signal":"重新命名訊號","Delete signal?":"刪除這個訊號？","Delete rule?":"刪除這條規則？","Delete draft?":"刪除這筆草稿？",
};
let lang = (navigator.language || "en").toLowerCase().startsWith("zh") ? "zh" : "en";
try { lang = localStorage.getItem("lang") || lang; } catch (e) {}
const t = (s, vars) => { let r = (lang === "zh" && ZH[s]) || s; if (vars) for (const k in vars) r = r.replace("{" + k + "}", vars[k]); return r; };

/* ---------- tiny DOM helper ---------- */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (v === true) el.setAttribute(k, "");
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(c)); }
  return el;
}

/* ---------- IR helpers (ported from the firmware) ---------- */
function normalise(r) {
  r = r.slice();
  const marks = []; let total = 0;
  for (let k = 2; k + 1 < r.length; k += 2) if (r[k] < 1500) { total++; if (marks.length < 20) marks.push(r[k]); }
  if (total < 24) return r;
  marks.sort((a, b) => a - b);
  const canon = (marks[9] + marks[10]) / 2, tailn = Math.max(8, total >> 2);
  let sum = 0, cnt = 0;
  for (let k = ((r.length - 1) >> 1) << 1; k >= 2 && cnt < tailn; k -= 2) if (r[k] < 1500) { sum += r[k]; cnt++; }
  if (!cnt || sum / cnt > canon * 0.85) return r;
  for (let k = 2; k + 1 < r.length; k += 2) if (r[k] < 1500) { const s = r[k + 1] + r[k] - canon; r[k] = Math.round(canon); r[k + 1] = Math.max(100, Math.round(s)); }
  return r;
}
function rawMatch(a, b) {
  const L = Math.min(a.length, b.length);
  if (L < 4 || (a.length !== b.length && L < 20)) return false;
  for (let i = 0; i < L; i++) if (Math.abs(a[i] - b[i]) > Math.max(150, b[i] / 4)) return false;
  return true;
}
function nec(addr, cmd) {
  const w = (addr | ((~addr & 255) << 8) | (cmd << 16) | ((~cmd & 255) << 24)) >>> 0, r = [9000, 4500];
  for (let i = 0; i < 32; i++) r.push(560, (w >>> i) & 1 ? 1690 : 560);
  r.push(560); return r;
}
function describe(r) {
  const n = r.length, near = (v, x) => v > x * 0.7 && v < x * 1.3;
  if (n >= 66 && near(r[0], 9000) && near(r[1], 4500)) {
    let w = 0; for (let i = 0; i < 32; i++) if (near(r[3 + 2 * i], 1690)) w |= 1 << i;
    return "NEC a=" + (w & 255).toString(16).toUpperCase().padStart(2, "0") + " c=" + ((w >> 16) & 255).toString(16).toUpperCase().padStart(2, "0");
  }
  return n >= 100 ? "RAW-LONG n=" + n : "RAW n=" + n;
}

/* ---------- links ---------- */
class Link {
  constructor() { this.onLine = () => {}; this.onClose = () => {}; this.chain = Promise.resolve(); this.chunk = 20; this.name = ""; }
  send(line) { this.chain = this.chain.then(() => this._write(line + "\n")); return this.chain; }   // one whole line at a time
}
class BleLink extends Link {
  async open() {
    if (!navigator.bluetooth) throw new Error(t("Web Bluetooth needs Chrome or Edge (Android/desktop). On iPhone use a browser such as Bluefy."));
    this.dev = await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC] }, { namePrefix: "IRCapsule" }], optionalServices: [SVC] });
    this.name = this.dev.name || "IR Capsule";
    this.dev.addEventListener("gattserverdisconnected", () => this.onClose());
    const srv = await this.dev.gatt.connect(), svc = await srv.getPrimaryService(SVC);
    this.rx = await svc.getCharacteristic(RXU); this.tx = await svc.getCharacteristic(TXU);
    let buf = "";
    this.tx.addEventListener("characteristicvaluechanged", e => {
      buf += dec.decode(new Uint8Array(e.target.value.buffer), { stream: true });
      let i; while ((i = buf.indexOf("\n")) >= 0) { const l = buf.slice(0, i).trim(); buf = buf.slice(i + 1); if (l) this.onLine(l); }
    });
    await this.tx.startNotifications();
  }
  async _write(str) {
    const b = enc.encode(str);
    for (let i = 0; i < b.length; i += this.chunk) {
      const part = b.slice(i, i + this.chunk);
      if (this.rx.writeValueWithResponse) await this.rx.writeValueWithResponse(part); else await this.rx.writeValue(part);
    }
  }
  setMtu(mtu) { this.chunk = Math.max(20, Math.min(180, mtu - 3)); }
  close() { try { this.dev.gatt.disconnect(); } catch (e) {} }
}
class SerialLink extends Link {
  async open() {
    if (!navigator.serial) throw new Error(t("Web Serial needs desktop Chrome or Edge."));
    this.port = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x303a }] });
    await this.port.open({ baudRate: 115200 });
    try { await this.port.setSignals({ dataTerminalReady: false, requestToSend: false }); } catch (e) {}
    this.name = "USB";
    this.writer = this.port.writable.getWriter();
    (async () => {
      const r = this.port.readable.getReader(); let buf = "";
      try { for (;;) { const { value, done } = await r.read(); if (done) break;
        buf += dec.decode(value, { stream: true }); let i;
        while ((i = buf.indexOf("\n")) >= 0) { const l = buf.slice(0, i).trim(); buf = buf.slice(i + 1); if (l.startsWith("{")) this.onLine(l); } } }
      catch (e) {} this.onClose();
    })();
  }
  async _write(str) { await this.writer.write(enc.encode(str)); }
  async close() { try { this.writer.releaseLock(); await this.port.close(); } catch (e) {} }
}
class WsLink extends Link {
  async open(url) {
    this.name = "bridge";
    await new Promise((res, rej) => { this.ws = new WebSocket(url); this.ws.onopen = res; this.ws.onerror = () => rej(new Error("bridge not reachable")); });
    this.ws.onmessage = e => this.onLine(String(e.data)); this.ws.onclose = () => this.onClose();
  }
  async _write(str) { this.ws.send(str.trim()); }
  close() { this.ws.close(); }
}

/* ---------- demo device: a small in-page re-implementation of the protocol ---------- */
class MockLink extends Link {
  constructor() {
    super(); this.name = "demo"; this.s = { sigs: [], rules: [], devs: [], next: 1, layer: 0, rec: false, ring: [], seq: 0, log: [], lastFire: 0, dedupe: 400, name: "IRCapsule-DEMO" };
    this.raw = new Map();
    const S = this.s;
    const dev = (n) => { const id = S.devs.length + 1; S.devs.push({ id, name: n }); return id; };
    const sig = (name, kind, d, raw, proto, st = 1) => { const id = S.next++; S.sigs.push({ id, name, kind, st, hits: 1, dev: d, khz: 38, n: raw.length, p: proto || describe(raw) }); this.raw.set(id, raw); return id; };
    const tv = dev("Living room TV"), stb = dev("Set-top box");
    const kA = sig("Spare remote: key 1", 1, 0, nec(0x00, 0x45)), kB = sig("Spare remote: key 2", 1, 0, nec(0x00, 0x46));
    const tvp = sig("TV power", 0, tv, nec(0x04, 0x08)), tvv = sig("TV volume up", 0, tv, nec(0x04, 0x02)), sp = sig("Set-top power", 0, stb, nec(0x01, 0x51));
    S.rules.push({ id: S.next++, name: "Movie night", layer: 0, on: 1, trig: kA, act: [0, tvp, 1, 500, 0, sp] });
    this.ac = [0, 1].map(i => { const r = [3400, 1750]; for (let b = 0; b < 144; b++) r.push(400, ((b * 7 + i * 13) % 5 < 2) ? 1300 : 540); r.push(400); return r; });
    this.keys = { A: nec(0x00, 0x45), B: nec(0x00, 0x46), AC: this.ac[0], NEW: nec(0x20, 0x09) };
    S.log.push({ t: 1000, m: "boot ok" });
  }
  async open() {}
  async _write(str) { setTimeout(() => this.handle(str.trim()), 8); }
  emit(o) { setTimeout(() => this.onLine(JSON.stringify(o)), 2); }
  logm(m) { const e = { t: Math.round(performance.now()), m }; this.s.log.push(e); this.emit({ ev: "log", ...e }); }
  hear(raw) {   // a remote key press arrives
    const S = this.s; raw = normalise(raw); const seq = ++S.seq; let draft = 0, matched = 0, hit = S.sigs.find(x => this.raw.has(x.id) && rawMatch(raw, this.raw.get(x.id)));
    const fr = { seq, t: Math.round(performance.now()), gap: -1, n: raw.length, p: describe(raw), m: 0, sig: hit ? hit.id : 0, draft: 0, rec: S.rec ? 1 : 0, raw }; S.ring.push(fr); if (S.ring.length > 6) S.ring.shift();

/* ---------- protocol client ---------- */
class Device {

  on(fn) { this.handlers.push(fn); }

    const p = this.pending.get(m.q); if (!p) return;

  call(cmd, args = {}, timeout = 20000) {

    await link.open(url);
    link.onClose = () => { if (S.link === link) disconnected(); };
    S.link = link; S.dev = new Device(link); S.dev.on(onEvent);
    if (kind === "serial" || kind === "ws") {   // opening the port reboots the board; wait until it answers
      for (let i = 0; i < 25; i++) { try { await S.dev.call("ping", {}, 600); break; } catch (e) { if (i === 24) throw new Error("device does not answer"); } }
    }
    await refresh();
    if (kind === "ble") link.setMtu(S.info.mtu || 23);
    const lg = await S.dev.call("log"); S.logs = lg.log.map(x => ({ ev: "log", ...x }));
    setStatus("connected", link.name); renderTabs(); render();
  } catch (e) {
    console.error(e); if (link && link.close) try { link.close(); } catch (x) {}

}
