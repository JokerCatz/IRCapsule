<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IR Capsule</title>
<style>
  :root {
    --bg:#f6f7f4; --fg:#1a231f; --muted:#5c6a63; --line:#cbd3cd; --panel:#ecefe9; --card:#fbfcfa;
    --accent:#17744a; --accent-fg:#ffffff; --warn:#8a5a00; --warnbg:#f6ecd2; --bad:#b8321f; --info:#1c62a8;
    --wave:#17744a; --wave-bg:#e3e9e3;
    --sans:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0f1512; --fg:#e3ebe6; --muted:#98a7a0; --line:#2c3833; --panel:#17201c; --card:#131b17;
    --accent:#74d3a2; --accent-fg:#06180f; --warn:#f2c66d; --warnbg:#2a2414; --bad:#ff8f7a; --info:#86bdf0;
    --wave:#74d3a2; --wave-bg:#1c2823; color-scheme:dark; } }
  :root[data-theme="dark"]{
    --bg:#0f1512; --fg:#e3ebe6; --muted:#98a7a0; --line:#2c3833; --panel:#17201c; --card:#131b17;
    --accent:#74d3a2; --accent-fg:#06180f; --warn:#f2c66d; --warnbg:#2a2414; --bad:#ff8f7a; --info:#86bdf0;
    --wave:#74d3a2; --wave-bg:#1c2823; color-scheme:dark; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans)}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
  .bar{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  h1{font-size:1.15rem;margin:0;letter-spacing:-.01em}
  .grow{flex:1}
  main{max-width:1100px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
  nav{max-width:1100px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
  nav button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 14px;color:var(--muted);cursor:pointer;font:inherit;white-space:nowrap}
  nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
  button,select,input,textarea{font:inherit;color:var(--fg)}
  button.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer}
  button.btn:hover{border-color:var(--accent)}
  button.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
  button.btn.danger{color:var(--bad)}
  button.btn:disabled{opacity:.45;cursor:default}
  input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
  .card h2{font-size:1rem;margin:0}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .muted{color:var(--muted)} .mono{font-family:var(--mono);font-size:.92em}
  .chip{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--line);font-size:.8rem;color:var(--muted);white-space:nowrap}
  .chip.ok{color:var(--accent);border-color:var(--accent)} .chip.warn{color:var(--warn);border-color:var(--warn)} .chip.bad{color:var(--bad);border-color:var(--bad)}
  .note{background:var(--warnbg);border-left:3px solid var(--warn);padding:8px 12px;border-radius:0 4px 4px 0}
  .tablewrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--muted);font-weight:600;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase}
  canvas.wave{display:block;background:var(--wave-bg);border-radius:4px}
  .live{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto}
  .live .item{display:flex;gap:10px;align-items:center;padding:4px 6px;border-radius:6px;background:var(--panel)}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
  .dot.on{background:var(--bad);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.25}}
  @media (prefers-reduced-motion: reduce){.dot.on{animation:none}}
  .log{font-family:var(--mono);font-size:.85rem;display:flex;flex-direction:column;gap:2px;max-height:60vh;overflow-y:auto}
  .log div{display:flex;gap:10px} .log .t{color:var(--muted);min-width:64px}
  .bar-meter{height:8px;border-radius:4px;background:var(--panel);overflow:hidden;min-width:120px}
  .bar-meter i{display:block;height:100%;background:var(--accent)}
  dialog{border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);max-width:min(1000px,94vw);width:100%;padding:16px}
  dialog::backdrop{background:rgba(0,0,0,.5)}
  .wavebox{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
  .hero{text-align:left;max-width:640px}
  .live .item{flex-wrap:wrap}
  @media (max-width:700px){   /* phones: tables become stacked cards so the name field is never off-screen */
    table.stack thead{display:none}
    table.stack tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
    table.stack td{border:0;padding:0}
    table.stack.drafts td:nth-child(n+6), table.stack.sigs td:first-child, table.stack.sigs td:last-child, table.stack.rules td:nth-child(4), table.stack.rules td:last-child{grid-column:1/-1}
    table.stack input, table.stack select{width:100%}
  }
  [hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>IR Capsule</h1>
    <span id="status" class="chip">disconnected</span>
    <span class="grow"></span>
    <span id="recbadge" class="chip bad" hidden><span class="dot on"></span> <span data-i="Recording">Recording</span></span>
    <button class="btn" id="lang" title="Language">中文</button>
    <button class="btn" id="disc" hidden></button>
  </div>
  <nav id="tabs" role="tablist" hidden></nav>
</header>
<main id="app"></main>
<dialog id="dlg"></dialog>

<script>

   (docs/protocol.md) over Web Bluetooth, Web Serial, a dev WebSocket bridge, or a built-in demo.
   ========================================================================================= */
const SVC = "9f1d0001-6b7a-4c5e-8a2b-1c4a9e5d7f10", RXU = "9f1d0002-6b7a-4c5e-8a2b-1c4a9e5d7f10", TXU = "9f1d0003-6b7a-4c5e-8a2b-1c4a9e5d7f10";
const ST = { DRAFT: 0, ACTIVE: 1, OFF: 2 };
const enc = new TextEncoder(), dec = new TextDecoder();
const $ = (s, e = document) => e.querySelector(s);

/* ---------- i18n: English strings are the keys ---------- */
const ZH = {
  "Connect your IR Capsule":"連接你的 IR 膠囊","Bluetooth":"藍牙","USB serial":"USB 序列埠","Demo (no device)":"示範（不需裝置）",
  "disconnected":"未連線","connecting…":"連線中…","connected":"已連線","Disconnect":"中斷連線","Recording":"錄製中",
  "Record":"錄製","Signals":"訊號","Rules":"對照","Log":"紀錄","Device":"裝置",
  "Start recording":"開始錄製","Stop recording":"停止錄製","Point any remote at the receiver and press keys. Each new key becomes a numbered draft; pressing the same key again only raises its counter. Name the drafts below to make them usable.":"對著接收頭按任何遙控器的鍵。每個新的鍵會成為一筆依序編號的草稿，重複按同一個鍵只會增加次數。在下方為草稿命名後才能使用。",
  "LED test":"LED 測試","Start LED test":"開始 LED 測試","Stop":"停止","All LEDs blink for 60 s. Look through a phone camera (try the front one). Don't stare at them up close.":"所有 LED 閃爍 60 秒。請用手機相機觀看（先試前鏡頭），不要近距離直視。",
  "Live frames":"即時收到的訊號","Clear list":"清除清單","Not saved: signals or rules on this capsule differ from the ones you were editing with. Press Done to discard, then edit again.":"沒有儲存：這個膠囊上的訊號或規則和你編輯時使用的不同。請按「完成」放棄變更，再重新編輯。","The remotes on the capsule changed since you started editing, or this is another capsule. Overwrite them?":"開始編輯後，膠囊上的遙控器版面已經改變，或這是另一個膠囊。要覆寫嗎？","It holds a remote this page cannot read: restore it with the newer page that wrote it.":"檔案裡有這個網頁看不懂的遙控器，請用寫出它的新版網頁還原。","Writing remotes":"正在寫入遙控器","The capsule holds a remote this page cannot read. Use a newer page, or delete that remote in the Remotes tab first.":"膠囊上有這個網頁看不懂的遙控器。請改用新版網頁，或先到「遙控器」分頁刪除它。","This file has no remotes: yours are kept, but their IR and rule buttons will be unavailable, because restored signals and rules get new numbers.":"這個檔案沒有遙控器版面：現有版面會保留，但因為還原的訊號與規則會換新編號，版面裡的紅外線與規則按鈕會無法使用。","Restoring replaces all signals, drafts, rules, devices, remotes and settings with the file. The TV pairing and the access header are not part of a backup and stay as they are.":"還原會用檔案內容取代所有訊號、草稿、規則、裝置、遙控器與設定。電視配對和存取 header 不在備份裡，會維持現狀。","Remotes":"遙控器","IR signals":"紅外線訊號","Relay rules":"轉送規則","TV over Bluetooth":"藍牙電視","Send TV key":"送出電視按鍵","TV key":"電視按鍵","long":"長按","untested":"未實測","no effect on the tested TV":"在測試的電視上沒反應","TV not connected":"電視未連線","The rule was deleted":"規則已刪除","The signal was deleted":"訊號已刪除","The signal is a draft":"訊號還是草稿","The signal is disabled":"訊號已停用","Discard unsaved changes?":"要放棄尚未儲存的變更嗎？","A remote needs a name of up to 31 bytes.":"遙控器需要名稱，最長 31 bytes。","This remote is too large to store: {n}":"這支遙控器太大，無法儲存：{n}","Not saved completely. Keep this page open and press Save again.":"沒有完整儲存。請保持頁面開啟，再按一次儲存。","Choose what the button does.":"請選擇按鈕的動作。","The label is too long (24 bytes: about 8 Chinese characters or 24 letters).":"名稱太長（24 bytes，約 8 個中文字或 24 個英文字母）。","Other code…":"其他代碼…","Default colour":"預設顏色","Colour":"顏色","Button":"按鈕","Label":"名稱","(name of the action)":"（使用動作名稱）","Action":"動作","Send IR signal":"發送紅外線訊號","Run a rule":"執行規則","Long press (1 s)":"長按（1 秒）","Repeat while held":"按住連發","Every (ms, 150–1000)":"間隔（毫秒，150–1000）","Apply":"套用","Cancel cell":"取消這一格","Move":"移動","Tap the place to move it to.":"點選要移到的位置。","Clear cell":"清除這一格","Add row":"加一列","Remove row":"減一列","The last row has buttons. Remove it?":"最後一列有按鈕，要移除嗎？","New remote":"新增遙控器","Copy remote":"複製遙控器","Move earlier":"往前排","Move later":"往後排","Delete remote":"刪除遙控器","This page cannot read that remote. Delete it anyway?":"這個網頁看不懂這支遙控器，仍要刪除嗎？","Remote":"遙控器","(unreadable remote)":"（無法讀取的遙控器）","Try again":"再試一次","Update the capsule's firmware to store remotes. The default remote still works.":"請更新膠囊韌體才能儲存遙控器版面。預設遙控器仍可使用。","Discard":"放棄變更","Done":"完成","This default remote is not stored yet. Edit it and press Save to keep it on the capsule.":"這支預設遙控器尚未儲存。按「編輯」後儲存，才會存進膠囊。","This page cannot read this remote: it was saved by a newer page or is damaged. It is left as it is.":"網頁看不懂這支遙控器：它可能由較新的網頁儲存，或資料損壞。內容會原樣保留。","TV keys need a connected TV (pair it on the Device tab).":"電視按鍵需要電視已連線（到「裝置」分頁配對）。","encrypted":"已加密","not encrypted":"未加密","Show all Bluetooth devices":"顯示全部藍牙裝置","This capsule needs its access header.":"這個膠囊需要存取 header。","The header was not accepted (wrong header).":"header 錯誤，膠囊沒有接受。","Too soon after a wrong header. Wait a few seconds and try again.":"剛輸入錯誤的 header，請等幾秒再試。","Connect with this header":"用這個 header 連線","No access header: anyone in Bluetooth range can control this capsule. Setting one is recommended.":"尚未設定存取 header：藍牙範圍內的任何人都能控制這個膠囊。建議設定。","Set one":"去設定","Use 1–64 of these characters: A–Z a–z 0–9 - _ . ~":"請使用 1–64 個字元：A–Z a–z 0–9 - _ . ~","Remove the access header? Anyone in Bluetooth range will be able to control the capsule.":"要移除存取 header 嗎？藍牙範圍內的任何人都將能控制膠囊。","The new header will cross Bluetooth unencrypted this once: someone listening right now could learn it. Set it? (Over USB nothing goes over the air.)":"這一次新的 header 會以未加密的方式經過藍牙，此刻在監聽的人可能得知它。要設定嗎？（用 USB 設定就不會經過無線傳輸。）","Bluetooth access":"藍牙存取","Update the capsule's firmware to use this.":"請更新膠囊韌體後使用。","Short headers can be guessed from recorded traffic. Use 16 characters or more.":"太短的 header 可能被人用錄下的傳輸內容猜出來，建議 16 個字元以上。","New header":"新的 header","With a header, only those who know it can use the capsule over Bluetooth, and the traffic is encrypted. USB never needs it. Holding the header or the NFC tag is enough to get in.":"設定 header 後，只有知道的人能透過藍牙使用膠囊，傳輸內容也會加密。USB 永遠不需要 header。拿到 header 或 NFC 貼紙就能使用。","Header set":"已設定 header","No header":"未設定 header","URL for an NFC tag (write it again after changing the header)":"NFC 貼紙用網址（更改 header 後要重新寫入）","Show":"顯示","Hide":"隱藏","Copy URL":"複製網址","Copy it by hand.":"請手動複製。","Generate":"隨機產生","Save header":"儲存 header","Remove header":"移除 header","Forget on this browser":"忘記這個瀏覽器儲存的內容","Forgotten on this browser":"已從這個瀏覽器移除","Test send":"試發","Home":"首頁","Input source *":"輸入來源 *","TV settings *":"電視設定 *","Previous":"上一個","Rewind":"倒轉","Play / Pause":"播放／暫停","Fast forward":"快轉","Next":"下一個","Stop playback":"停止播放","Menu":"選單","Search":"搜尋","Guide":"節目表","Info":"資訊","Channel +":"頻道 +","Channel −":"頻道 −","Power (Bluetooth)":"電源（藍牙）","Input source (2nd way)":"輸入來源（第二種）","TV settings (2nd way)":"電視設定（第二種）","Menu (2nd way)":"選單（第二種）","Up (2nd way)":"上（第二種）","Down (2nd way)":"下（第二種）","Left (2nd way)":"左（第二種）","Right (2nd way)":"右（第二種）","Nothing sent yet.":"還沒有送出任何按鍵。","Long press (hold each key for 1 s)":"長按（每個鍵按住 1 秒）","Keys marked * are expected to work only in compatibility mode (below).":"標 * 的鍵預期要開啟下方的相容模式才有作用。","Playback":"播放控制","More keys":"更多按鍵","Power over Bluetooth may not wake the TV from standby, and may switch it off.":"藍牙電源鍵可能無法把電視從待機喚醒，也可能讓電視關機。","Second way":"第二種送法","The same functions sent with other codes. Try these when a key above does nothing.":"同樣的功能改用另一組代碼送出。上面的鍵沒反應時試這裡。","Compatibility mode":"相容模式","Use the ids of Google's remote (0957:0001)":"使用 Google 遙控器的識別碼（0957:0001）","Report Google's function h(tag, props, ...kids) {

    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;

class Device {

  on(fn) { this.handlers.push(fn); }
  _line(l) {
    let m; try { m = JSON.parse(l); } catch (e) { return; }
    if (m.ev) { this.handlers.forEach(f => f(m)); return; }
    const p = this.pending.get(m.q); if (!p) return;
    this.pending.delete(m.q); clearTimeout(p.timer);

  }
  /* One command at a time: the capsule's queue is short, and its replies come in order anyway. */
  call(cmd, args = {}, timeout = 20000) {

    const result = (this.turn || Promise.resolve()).then(run, run);
    this.turn = result.catch(() => {});
    return result;
  }
  _call(cmd, args, timeout) {
    const q = ++this.q;
    return new Promise((res, rej) => {
      const timer = setTimeout(() => { this.pending.delete(q); rej(new Error("timeout: " + cmd)); }, timeout);
      this.pending.set(q, { res, rej, timer });
      this.link.send(JSON.stringify({ q, cmd, ...args })).catch(e => { clearTimeout(timer); this.pending.delete(q); rej(e); });
    });

/* Everything the firmware could refuse or silently cut short is checked here, before anything is deleted. */
function checkBackup(d, max) {

  need(d && d.format === "ir-capsule-backup", "not a backup file");

  need(Array.isArray(d.devices) && Array.isArray(d.signals) && Array.isArray(d.rules), "a list is missing");
  need(d.signals.length <= max.sig, "too many signals"); need(d.rules.length <= max.rule, "too many rules"); need(d.devices.length <= max.dev, "too many devices");
  const devIds = ids(d.devices, "device"); ids(d.signals, "signal"); ids(d.rules, "rule");
  for (const x of d.devices) need(text(x.name, 31) && x.name, "device name");
  for (const s of d.signals) {
    const w = "signal " + s.id + ": ";
    need(text(s.name, 31), w + "name"); need(int(s.st, 0, 2), w + "state"); need(s.st === ST.DRAFT || s.name, w + "needs a name");
    need(int(s.kind, 0, 1), w + "type"); need(int(s.khz, 20, 60), w + "carrier"); need(s.dev === 0 || devIds.has(s.dev), w + "unknown device");
    need(text(s.p || "", 23), w + "protocol label");
    need(Array.isArray(s.raw) && s.raw.length >= 4 && s.raw.length <= max.raw && s.raw.every(v => int(v, 0, 65535)), w + "waveform");
  }
  need(d.signals.filter(s => s.st === ST.DRAFT).length <= MAX_DRAFTS, "too many drafts");
  const usable = new Set(d.signals.filter(s => s.st !== ST.DRAFT).map(s => s.id));
  for (const r of d.rules) {
    const w = "rule " + r.id + ": ";
    need(text(r.name, 31), w + "name"); need(int(r.layer, 0, 255), w + "layer"); need(int(r.on, 0, 1), w + "on/off");
    need(r.trig === 0 || usable.has(r.trig), w + "trigger signal is missing or a draft");
    need(Array.isArray(r.act) && r.act.length % 2 === 0 && r.act.length <= 2 * max.act, w + "steps");
    for (let i = 0; i < r.act.length; i += 2) {

      if (r.act[i] === 3) { const v = r.act[i + 1], code = v & 0x3FF; need(!(v & ~(KB | LONG | 0x3FF)) && code >= 1 && (!(v & KB) || code <= 0xFF), w + "TV key"); }

async function writeBackup(d, progress) {

  const old = await S.dev.call("list");
  progress(t("Removing current data") + "…");

  for (const s of old.sig) await S.dev.call("sig_del", { id: s.id });

  for (const x of d.devices) devMap.set(x.id, (await S.dev.call("dev_put", { name: x.name })).id);
  let n = 0;
  for (const s of d.signals) {
    progress(t("Writing signals") + " " + (++n) + "/" + d.signals.length);
    const args = { state: s.st, kind: s.kind, dev: devMap.get(s.dev), khz: s.khz, proto: s.p || "", raw: s.raw };

  for (const r of d.rules) ruleMap.set(r.id, (await S.dev.call("rule_put", { name: r.name, layer: r.layer, on: r.on, trig: sigMap.get(r.trig), act: steps(r) })).id);

    progress(t("Writing remotes") + "…");
    const blobs = d.remotes.map(x => ({ slot: x.slot, b64: blobOf({ ...x.data, c: x.data.c.map(c =>   // a target that is already gone becomes 0, which no signal or rule ever gets
      c.t === "s" ? { ...c, k: sigMap.get(c.k) || 0 } : c.t === "r" ? { ...c, k: ruleMap.get(c.k) || 0 } : c) }) }));
    for (const s of (await S.dev.call("ui_list")).slots) await S.dev.call("ui_del", { slot: s.slot });
    for (const x of blobs) await S.dev.call("ui_put", { slot: x.slot, data: x.b64 });
    for (const x of blobs) if ((await S.dev.call("ui_get", { slot: x.slot })).data !== x.b64) throw new Error(t("Check failed") + ": remote " + x.slot);
    if ((await S.dev.call("ui_list")).slots.length !== blobs.length) throw new Error(t("Check failed") + ": remotes");

  }

  const same = (a, b, what) => { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(t("Check failed") + ": " + what); };
  same([now.dev.length, now.sig.length, now.rule.length], [d.devices.length, d.signals.length, d.rules.length], "count");
  for (const x of d.devices) same((now.dev.find(y => y.id === devMap.get(x.id)) || {}).name, x.name, x.name);
  for (const s of d.signals) {
    const got = await S.dev.call("get", { id: sigMap.get(s.id) });
    const pick = (o, dev) => [o.name, o.st, o.kind, dev, o.khz, o.p || "", o.raw];
    same(pick(got, got.dev), pick(s, devMap.get(s.dev)), s.name || "draft " + s.id);
  }
  for (const r of d.rules) {
    const got = now.rule.find(y => y.id === ruleMap.get(r.id)) || {};

/* "Import" replaces what is on the capsule with the file. */
async function importBackup(file) {
  if (!file || S.restoring) return;
  const done = (text, bad) => { S.restoring = ""; S.restoreMsg = { text, bad }; if (S.dev) refresh().catch(() => {}); render(); };
  const progress = text => { S.restoring = text; render(); };
  S.restoreMsg = null;
  progress(t("Checking") + "…");
  let data, current;
  try {
    data = JSON.parse(await file.text());
    const info = await S.dev.call("info");
    checkBackup(data, info.max);
    current = await collectBackup();
    if (current.remotes.some(x => x.unreadable)) throw new Error(t("The capsule holds a remote this page cannot read. Use a newer page, or delete that remote in the Remotes tab first."));
    if (data.version >= 3 && data.remotes.length) await S.dev.call("ui_list");     // old firmware: refuse before anything is touched
  } catch (e) { return done(t("Cannot restore from this file. Nothing was changed.") + " (" + e.message + ")", true); }

  const was = count(current), will = count(data);

    t("Removed: {s} signals, {r} rules, {d} devices", was) + "\n" + t("Written: {s} signals, {r} rules, {d} devices", will) + "\n\n" +
    (data.version < 3 && current.remotes.length ? t("This file has no remotes: yours are kept, but their IR and rule buttons will be unavailable, because restored signals and rules get new numbers.") + "\n\n" : "") +
    t("The current data was just downloaded as ir-capsule-before-restore.json. Check that the file is there before you continue.");
  if (!confirm(question)) return done(t("Cancelled. Nothing was changed."), false);
  try { await writeBackup(data, progress); }
  catch (e) { return done(t("Restore did not finish; the capsule may hold only part of the backup. Reconnect if needed and import the same file again.") + " (" + e.message + ")", true); }
  S.raw.clear(); S.edits.clear(); S.remotes = null; S.edit = null; S.cell = null;
  const named = data.version >= 2 && data.settings.name && data.settings.name !== current.device;
  done(t("Restore finished and checked.") + (named ? " " + t("The Bluetooth name changes after a reboot.") : ""), false);
}
function restoreNote() {
  if (S.restoring) return h("div", { class: "note", id: "restoremsg" }, S.restoring);
  const m = S.restoreMsg;
  return m ? h("div", { class: m.bad ? "note" : "muted", id: "restoremsg" }, m.text) : null;
}

/* ---------- boot ---------- */
takeAccessFromUrl();
$("#lang").onclick = () => { lang = lang === "zh" ? "en" : "zh"; try { localStorage.setItem("lang", lang); } catch (e) {} applyLang(); };
$("#disc").onclick = () => { if (S.link && S.link.close) S.link.close(); disconnected(); };
function applyLang() {
  $("#lang").textContent = lang === "zh" ? "English" : "中文"; document.documentElement.lang = lang === "zh" ? "zh-TW" : "en";
  document.querySelectorAll("[data-i]").forEach(e => e.textContent = t(e.dataset.i)); setStatus(S.status); renderTabs(); render();
}
applyLang();
(() => { const p = new URLSearchParams(location.search); if (p.get("demo") === "1") connect("demo"); else if (p.get("bridge") && p.get("auto") === "1") connect("ws", p.get("bridge")); })();
</script>
